project:
  type: book

filters:
  - details
  - custom-numbered-blocks

extensions:
  details:
    interactive:
      open: false
      show-controls: false
    non-interactive:
      display: remove
      summary-text: "Details"
      callout-type: note
  custom-numbered-blocks:
    appearances:
      concept:
        container: foldbox
        boxstyle: foldbox.simple
        collapse: false
        colors: ['#F4EAF0', '#7C3F58']
      reference:
        container: foldbox
        boxstyle: foldbox.simple
        collapse: false
        colors: ['#EEF1F3', '#5B6770']
      practice:
        container: foldbox
        boxstyle: foldbox.simple
        collapse: false
        colors: ['#E7F4F5', '#147D85']
    classes:
      Definition:
        appearance: concept
      Notation:
        appearance: reference
      TechnicalDetail:
        appearance: reference
        label: "Technical detail"
        collapse: true
      Exercise:
        appearance: practice

book:
  title: "Introduction to Statistics and Data Science"
  author: ""
  chapters:
    - index.qmd
    - part: "Visualizing and summarizing a single variable"
      chapters:
        - singlevar_01_visualizing-distributions.qmd
        - singlevar_02_describing-distributions.qmd
        - singlevar_03_location-and-spread.qmd
        - singlevar_04_transformations.qmd
        - singlevar_05_categorical.qmd
    - part: "Visualizing and summarizing 2+ variables"
      chapters:
        - twovar_01_categorical-categorical.qmd
        - twovar_02_quantitative-quantitative.qmd
        - twovar_03_categorical-quantitative.qmd
        - twovar_04_multivariate.qmd
    - part: "Probability and Sampling"
      chapters:
      - prob_01_intro.qmd
      - prob_02_probability-basics.qmd
      - prob_03_distribution-parameters.qmd
      - prob_04_normal.qmd
      - prob_05_multivariate-distributions.qmd
      - prob_07_combining-random-variables.qmd
    - part: "Statistical Inference"
      chapters:
      - inference_01_sampling-distributions.qmd
      - inference_02_hypothesis-tests.qmd
      - inference_03_limits.qmd
    - part: "Linear Regression"
      chapters:
      - regression_01_intro.qmd
      - regression_02_prediction.qmd
      - regression_03_model.qmd
      - regression_04_categorical.qmd
      - regression_05_interactions.qmd
      - regression_06_nonlinear.qmd
    - part: "Building Prediction Models and Algorithms"
      chapters:
      - prediction_01_error.qmd
  appendices:
    - appendix_data.qmd
    - data.qmd
    - sap_sampling_app.qmd
    - sap_bootstrap_app.qmd
    - bagging_app.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles/callouts.css
    number-sections: true

execute:
  echo: false
  warning: false
  message: false
