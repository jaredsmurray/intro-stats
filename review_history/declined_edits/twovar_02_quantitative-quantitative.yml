    declined_proposal: Add an explanation of the n-minus-one degrees-of-freedom convention.
    author_rationale: Students do not compute these statistics by hand, so the convention does not advance the chapter's objective.
    scope: Do not add a degrees-of-freedom detour to this treatment.
