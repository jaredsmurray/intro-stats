# What the repo's structure means to the build tooling — the one place that
# knowledge lives. Consumers:
#
#   ship.sh     [classify]      maps changed files to build targets
#   clean.sh    [render-dirs]   + [render-globs]: regenerable output (--deep)
#
# [classify]: shell-glob pattern, whitespace, target. FIRST MATCH WINS, so
# specific patterns must precede general ones. Targets:
#   none      no effect on the published site
#   book      full book render
#   chapter   rebuild just this chapter (per-file --only; publish.sh still
#             blocks the deploy if the chapter's own numbering changed)

[classify]
# No effect on the published site:
todo/*                  none
plans/*                 none
working/*               none
review_history/*        none
.claude/*               none
.agents/*               none
.gitignore              none
*.md                    none
tools/*                 none
tests/*                 none
style_terms.tsv         none
targets.conf            none
site.conf               none
data_pin                none
clean.sh                none
publish.sh              none
ship.sh                 none

# Book inputs of project-wide reach:
_quarto.yml             book
index.qmd               book
references.bib          book
images/*                book
styles/*                book
tex/*                   book
_extensions/*           book
R/*                     book
data_derived/*          book

# Render droppings that can sit next to sources:
*_files/*               none
*.html                  none
*.rmarkdown             none

# A loose .R at the repo root is scratch or an in-progress figure script,
# never a build input (every real home for R code matched above):
*.R                     none

# Any other .qmd is a book chapter:
*.qmd                   chapter

# Regenerable render output. [render-dirs] are cache/output directories
# clean.sh --deep removes; [render-globs] are rendered files it also removes
# (** means any depth).

[render-dirs]
_book
.quarto
_freeze

[render-globs]
