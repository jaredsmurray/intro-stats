# qmd-checks scan-set declaration for the intro-stats book repo.
# Project-owned: an install.sh re-run updates the engines, never this file.
#
# Shell KEY=VALUE syntax (sourced by check_terms.sh and parsed line-wise by the
# R engines -- keep it to plain assignments, no logic). Globs are relative to
# the project root and space-separated.

# --- check_terms.sh ----------------------------------------------------------
# Rules TSV (relative to project root), scan globs, and a basename regex for
# files to skip. The sap exclusions are inherited from the pre-split repo,
# where those files carried large inlined shinylive app sources; the pages are
# now short link pages, so the exclusion is harmless either way.
TERMS_RULES="style_terms.tsv"
TERMS_GLOBS="*.qmd"
TERMS_EXCLUDE_RE="^(sap_sampling_app|sap_bootstrap_app)\.qmd$"

# --- check_number_consistency.R ----------------------------------------------
# Scan globs for --all, basename skip regex, and the adjudicated-ignore TSV
# (relative to project root). Basenames starting with "_" are always skipped.
# No slides in this repo: the decks live in intro-stats-decks.
NUMCONS_GLOBS="*.qmd"
NUMCONS_EXCLUDE_RE="^(sap_sampling_app|sap_bootstrap_app)\.qmd$"
NUMCONS_IGNORE="tools/number_consistency_ignore.tsv"

# --- check_rounded_arithmetic.R ----------------------------------------------
# Rendered-HTML directory scanned by --all (explicit file arguments bypass it).
ARITH_HTML_DIR="_book"
